services:
  mongo_db:
    image: mongo:7.0
    container_name: mongo_db
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USER: ${MONGO_USER}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-service:
    build: ../platform/config-service
    container_name: config-service
    environment:
      - SPRING_PROFILES_ACTIVE=native
    ports: [ "8888:8888" ]
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  eureka-service:
    build: ../platform/eureka-service
    container_name: eureka-service
    depends_on:
      config-service:
        condition: service_healthy
    ports: [ "8761:8761" ]   # solo para ver dashboard en local
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  iam-service:
    build: ../services/iam-service
    container_name: iam-service
    depends_on:
      eureka-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${IAM_POSTGRES_HOST}
      - POSTGRES_PORT=${IAM_POSTGRES_PORT}
      - POSTGRES_DATABASE=${IAM_POSTGRES_DATABASE}
      - POSTGRES_USER=${IAM_POSTGRES_USER}
      - POSTGRES_PASSWORD=${IAM_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  goals-service:
    build: ../services/goals-service
    container_name: goals-service
    depends_on:
      iam-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${GOALS_POSTGRES_HOST}
      - POSTGRES_PORT=${GOALS_POSTGRES_PORT}
      - POSTGRES_DATABASE=${GOALS_POSTGRES_DATABASE}
      - POSTGRES_USER=${GOALS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${GOALS_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  mealplan-service:
    build: ../services/mealplan-service
    container_name: mealplan-service
    depends_on:
      iam-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${MEALPLAN_POSTGRES_HOST}
      - POSTGRES_PORT=${MEALPLAN_POSTGRES_PORT}
      - POSTGRES_DATABASE=${MEALPLAN_POSTGRES_DATABASE}
      - POSTGRES_USER=${MEALPLAN_POSTGRES_USER}
      - POSTGRES_PASSWORD=${MEALPLAN_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  nutritionist-service:
    build: ../services/nutritionist-service
    container_name: nutritionist-service
    depends_on:
      iam-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${NUTRITIONIST_POSTGRES_HOST}
      - POSTGRES_PORT=${NUTRITIONIST_POSTGRES_PORT}
      - POSTGRES_DATABASE=${NUTRITIONIST_POSTGRES_DATABASE}
      - POSTGRES_USER=${NUTRITIONIST_POSTGRES_USER}
      - POSTGRES_PASSWORD=${NUTRITIONIST_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8085/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  profiles-service:
    build: ../services/profiles-service
    container_name: profiles-service
    depends_on:
      iam-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${PROFILES_POSTGRES_HOST}
      - POSTGRES_PORT=${PROFILES_POSTGRES_PORT}
      - POSTGRES_DATABASE=${PROFILES_POSTGRES_DATABASE}
      - POSTGRES_USER=${PROFILES_POSTGRES_USER}
      - POSTGRES_PASSWORD=${PROFILES_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8086/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  recipes-service:
    build: ../services/recipes-service
    container_name: recipes-service
    depends_on:
      iam-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${RECIPES_POSTGRES_HOST}
      - POSTGRES_PORT=${RECIPES_POSTGRES_PORT}
      - POSTGRES_DATABASE=${RECIPES_POSTGRES_DATABASE}
      - POSTGRES_USER=${RECIPES_POSTGRES_USER}
      - POSTGRES_PASSWORD=${RECIPES_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8087/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  recommendations-service:
    build: ../services/recommendations-service
    container_name: recommendations-service
    depends_on:
      iam-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${RECOMMENDATIONS_POSTGRES_HOST}
      - POSTGRES_PORT=${RECOMMENDATIONS_POSTGRES_PORT}
      - POSTGRES_DATABASE=${RECOMMENDATIONS_POSTGRES_DATABASE}
      - POSTGRES_USER=${RECOMMENDATIONS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${RECOMMENDATIONS_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8088/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  tracking-service:
    build: ../services/tracking-service
    container_name: tracking-service
    depends_on:
      iam-service:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=${TRACKING_POSTGRES_HOST}
      - POSTGRES_PORT=${TRACKING_POSTGRES_PORT}
      - POSTGRES_DATABASE=${TRACKING_POSTGRES_DATABASE}
      - POSTGRES_USER=${TRACKING_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TRACKING_POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8089/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  chat-service:
    build: ../services/chat-service
    container_name: chat-service
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
    environment:
      - MONGO_HOST=mongo_db
      - MONGO_PORT=27017
      - MONGO_DATABASE=${MONGO_DATABASE}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_AUTH_DB=chat_db
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8090/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway-service:
    build: ../platform/gateway-service
    container_name: gateway-service
    depends_on:
      eureka-service:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      goals-service:
        condition: service_healthy
      mealplan-service:
        condition: service_healthy
      nutritionist-service:
        condition: service_healthy
      profiles-service:
        condition: service_healthy
      recipes-service:
        condition: service_healthy
      recommendations-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    ports: [ "8080:8080" ]
    healthcheck:
      test: [ "CMD","curl","-f","http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
    driver: local

